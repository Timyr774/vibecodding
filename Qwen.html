```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCodeCamp — Полный курс Python</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a23;
  --bg-2: #1b1b32;
  --bg-3: #2a2a40;
  --text: #dfdfe2;
  --text-dim: #858590;
  --accent: #f1be32;
  --accent-hover: #f6c445;
  --green: #acd157;
  --red: #e74c3c;
  --blue: #3b82f6;
  --border: #3d3d5c;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
/* HEADER */
header {
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 20px;
  color: var(--accent);
  cursor: pointer;
}
.logo-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--bg);
  font-weight: 900;
  font-size: 20px;
}
.nav-tabs { display: flex; gap: 4px; }
.nav-tab {
  padding: 8px 16px;
  background: transparent;
  color: var(--text);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}
.nav-tab:hover { background: var(--bg-3); }
.nav-tab.active { background: var(--accent); color: var(--bg); }
.user-progress {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}
.progress-bar-mini {
  width: 120px; height: 8px;
  background: var(--bg-3);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar-mini-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--green));
  transition: width 0.5s;
}
/* LAYOUT */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: calc(100vh - 61px);
}
/* SIDEBAR */
.sidebar {
  background: var(--bg-2);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  overflow-y: auto;
  max-height: calc(100vh - 61px);
  position: sticky;
  top: 61px;
}
.sidebar h3 {
  padding: 0 20px 12px;
  color: var(--accent);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.lesson-list { list-style: none; }
.lesson-item {
  padding: 12px 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  font-size: 14px;
}
.lesson-item:hover { background: var(--bg-3); }
.lesson-item.active {
  background: var(--bg-3);
  border-left-color: var(--accent);
  color: var(--accent);
}
.lesson-item.completed .lesson-check {
  background: var(--green);
  color: var(--bg);
}
.lesson-check {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}
.lesson-item.active .lesson-check { border-color: var(--accent); }
.lesson-num {
  color: var(--text-dim);
  font-size: 12px;
  min-width: 22px;
}
/* MAIN */
.main {
  padding: 32px 48px;
  overflow-y: auto;
  max-height: calc(100vh - 61px);
}
.main-home {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 24px;
}
/* HOME */
.hero {
  text-align: center;
  padding: 60px 20px;
  background: linear-gradient(135deg, rgba(241,190,50,0.1), rgba(60,130,246,0.1));
  border-radius: 16px;
  border: 1px solid var(--border);
  margin-bottom: 40px;
}
.hero h1 {
  font-size: 48px;
  margin-bottom: 16px;
  background: linear-gradient(135deg, var(--accent), var(--green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero p {
  font-size: 18px;
  color: var(--text-dim);
  max-width: 600px;
  margin: 0 auto 24px;
  line-height: 1.6;
}
.btn {
  padding: 12px 28px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-block;
}
.btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
.btn-secondary {
  background: transparent;
  color: var(--accent);
  border: 2px solid var(--accent);
}
.btn-secondary:hover { background: var(--accent); color: var(--bg); }
.features {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}
.feature-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  transition: all 0.2s;
}
.feature-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.feature-icon {
  font-size: 32px;
  margin-bottom: 12px;
}
.feature-card h3 {
  margin-bottom: 8px;
  color: var(--accent);
}
.feature-card p { color: var(--text-dim); font-size: 14px; line-height: 1.5; }
/* LESSON */
.lesson-header {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.lesson-header .breadcrumb {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 8px;
}
.lesson-header h1 {
  font-size: 32px;
  color: var(--accent);
  margin-bottom: 8px;
}
.lesson-header .lesson-meta {
  color: var(--text-dim);
  font-size: 14px;
}
.theory {
  background: var(--bg-2);
  border-radius: 12px;
  padding: 28px;
  margin-bottom: 24px;
  line-height: 1.7;
  font-size: 16px;
}
.theory h2 {
  color: var(--accent);
  margin: 20px 0 12px;
  font-size: 22px;
}
.theory h2:first-child { margin-top: 0; }
.theory h3 {
  color: var(--text);
  margin: 16px 0 8px;
  font-size: 18px;
}
.theory p { margin-bottom: 12px; }
.theory ul, .theory ol { margin: 12px 0 12px 24px; }
.theory li { margin-bottom: 6px; }
.theory code {
  background: var(--bg-3);
  padding: 2px 8px;
  border-radius: 4px;
  font-family: "Fira Code", Consolas, monospace;
  color: var(--accent);
  font-size: 14px;
}
.theory pre {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin: 12px 0;
  overflow-x: auto;
}
.theory pre code {
  background: transparent;
  padding: 0;
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
}
.theory .note {
  background: rgba(241,190,50,0.1);
  border-left: 4px solid var(--accent);
  padding: 12px 16px;
  border-radius: 6px;
  margin: 16px 0;
}
.theory .warning {
  background: rgba(231,76,60,0.1);
  border-left: 4px solid var(--red);
  padding: 12px 16px;
  border-radius: 6px;
  margin: 16px 0;
}
/* TASK */
.task-section {
  background: var(--bg-2);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 24px;
  border: 1px solid var(--border);
}
.task-section h2 {
  color: var(--accent);
  margin-bottom: 16px;
  font-size: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.task-description {
  margin-bottom: 16px;
  line-height: 1.6;
}
.task-description code {
  background: var(--bg-3);
  padding: 2px 8px;
  border-radius: 4px;
  color: var(--accent);
  font-family: monospace;
}
.editor-wrap {
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 12px;
}
.editor-header {
  background: var(--bg-3);
  padding: 8px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text-dim);
}
.CodeMirror {
  height: auto !important;
  min-height: 180px;
  font-size: 14px;
  font-family: "Fira Code", Consolas, monospace;
}
.task-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn-run {
  background: var(--green);
  color: var(--bg);
}
.btn-run:hover { background: #bde06a; }
.btn-check {
  background: var(--accent);
  color: var(--bg);
}
.btn-reset {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-reset:hover { background: var(--bg-3); }
.output-section {
  margin-top: 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  font-family: monospace;
  font-size: 14px;
  min-height: 60px;
  max-height: 300px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
}
.output-section.error { border-color: var(--red); color: var(--red); }
.output-section.success { border-color: var(--green); color: var(--green); }
.output-label {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
/* LOADING */
.py-loading {
  position: fixed;
  inset: 0;
  background: rgba(10,10,35,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  flex-direction: column;
  gap: 20px;
}
.spinner {
  width: 50px; height: 50px;
  border: 4px solid var(--bg-3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* CERTIFICATE */
.certificate {
  background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
  border: 3px double var(--accent);
  border-radius: 16px;
  padding: 60px 40px;
  text-align: center;
  max-width: 800px;
  margin: 40px auto;
}
.certificate h1 {
  font-size: 42px;
  color: var(--accent);
  margin-bottom: 20px;
}
.certificate .cert-name {
  font-size: 32px;
  margin: 30px 0;
  color: var(--text);
}
.certificate .cert-date {
  color: var(--text-dim);
  margin-top: 30px;
}
/* NAV BUTTONS */
.lesson-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
/* MOBILE */
.menu-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    left: -300px;
    top: 61px;
    width: 280px;
    height: calc(100vh - 61px);
    transition: left 0.3s;
    z-index: 50;
  }
  .sidebar.open { left: 0; }
  .menu-toggle { display: block; }
  .main { padding: 20px; }
  .hero h1 { font-size: 32px; }
  .nav-tabs { display: none; }
}
/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--border); }
</style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:16px;">
    <button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
    <div class="logo" onclick="showHome()">
      <div class="logo-icon">Py</div>
      <span>PyCodeCamp</span>
    </div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="learn" onclick="switchTab('learn')">Курс</button>
    <button class="nav-tab" data-tab="home" onclick="showHome()">Главная</button>
    <button class="nav-tab" data-tab="cert" onclick="showCertificate()">Сертификат</button>
  </div>
  <div class="user-progress">
    <span id="progressText">0/20</span>
    <div class="progress-bar-mini">
      <div class="progress-bar-mini-fill" id="progressBar" style="width:0%"></div>
    </div>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <h3>📘 Программа курса</h3>
    <ul class="lesson-list" id="lessonList"></ul>
  </aside>
  <main class="main" id="mainContent"></main>
</div>

<div class="py-loading" id="pyLoading">
  <div class="spinner"></div>
  <div>Загружаем Python в браузере...</div>
  <div style="color:var(--text-dim); font-size:13px;" id="loadStatus">Инициализация Pyodide</div>
</div>

<script>
// ============ КУРС ПО PYTHON ============
const COURSE = [
  {
    id: 1,
    title: "Привет, Python!",
    duration: "5 мин",
    theory: `
      <h2>Что такое Python?</h2>
      <p>Python — это высокоуровневый язык программирования, созданный Гвидо ван Россумом в 1991 году. Он известен своим чистым синтаксисом и читаемостью кода.</p>
      <p>Python используется в:</p>
      <ul>
        <li>Веб-разработке (Django, Flask)</li>
        <li>Анализе данных и Machine Learning</li>
        <li>Автоматизации и скриптах</li>
        <li>Научных вычислениях</li>
        <li>Разработке игр</li>
      </ul>
      <h2>Ваша первая программа</h2>
      <p>Традиционно первая программа на любом языке выводит на экран «Hello, World!». В Python это делается одной строкой:</p>
      <pre><code>print("Hello, World!")</code></pre>
      <p>Функция <code>print()</code> выводит текст в консоль. Текст заключается в кавычки — двойные <code>"</code> или одинарные <code>'</code>.</p>
      <div class="note">💡 Python не требует точки с запятой в конце строки и фигурных скобок для блоков кода — вместо этого используются отступы.</div>
    `,
    task: {
      description: 'Выведите на экран фразу <code>Hello, Python!</code> с помощью функции <code>print()</code>.',
      starter: '# Напишите ваш первый код здесь\n',
      check: (output) => output.trim() === "Hello, Python!"
    }
  },
  {
    id: 2,
    title: "Переменные и типы данных",
    duration: "10 мин",
    theory: `
      <h2>Переменные</h2>
      <p>Переменная — это именованная ячейка памяти для хранения данных. В Python не нужно объявлять тип переменной — он определяется автоматически.</p>
      <pre><code>name = "Alice"
age = 25
height = 1.68
is_student = True</code></pre>
      <h2>Основные типы данных</h2>
      <ul>
        <li><code>int</code> — целые числа: <code>42</code>, <code>-7</code></li>
        <li><code>float</code> — дробные числа: <code>3.14</code>, <code>-0.5</code></li>
        <li><code>str</code> — строки: <code>"Привет"</code></li>
        <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
        <li><code>NoneType</code> — отсутствие значения: <code>None</code></li>
      </ul>
      <h2>Проверка типа</h2>
      <p>Функция <code>type()</code> возвращает тип объекта:</p>
      <pre><code>x = 10
print(type(x))  # &lt;class 'int'&gt;</code></pre>
      <h2>Правила именования</h2>
      <ul>
        <li>Имя может содержать буквы, цифры и символ подчёркивания</li>
        <li>Не может начинаться с цифры</li>
        <li>Регистр имеет значение: <code>Age</code> и <code>age</code> — разные переменные</li>
        <li>Нельзя использовать ключевые слова Python (<code>if</code>, <code>for</code>, <code>class</code> и др.)</li>
      </ul>
    `,
    task: {
      description: 'Создайте переменную <code>name</code> со значением <code>"Python"</code> и переменную <code>version</code> со значением <code>3</code>. Выведите их через пробел в одной строке.',
      starter: '# Создайте переменные name и version\n# Выведите их через пробел\n',
      check: (output) => output.trim() === "Python 3"
    }
  },
  {
    id: 3,
    title: "Операторы",
    duration: "10 мин",
    theory: `
      <h2>Арифметические операторы</h2>
      <pre><code>a = 10
b = 3
print(a + b)   # 13  сложение
print(a - b)   # 7   вычитание
print(a * b)   # 30  умножение
print(a / b)   # 3.333... деление
print(a // b)  # 3   целочисленное деление
print(a % b)   # 1   остаток от деления
print(a ** b)  # 1000 возведение в степень</code></pre>
      <h2>Операторы сравнения</h2>
      <pre><code>x = 5
print(x == 5)   # True  равно
print(x != 5)   # False не равно
print(x > 3)    # True  больше
print(x < 3)    # False меньше
print(x >= 5)   # True  больше или равно
print(x <= 4)   # False меньше или равно</code></pre>
      <h2>Логические операторы</h2>
      <pre><code>a = True
b = False
print(a and b)  # False
print(a or b)   # True
print(not a)    # False</code></pre>
      <div class="note">💡 Оператор <code>and</code> возвращает True, только если оба операнда True. Оператор <code>or</code> — если хотя бы один True.</div>
    `,
    task: {
      description: 'Вычислите и выведите результат выражения: <code>(15 + 5) * 2 - 10 // 3</code>. Должно получиться <code>37</code>.',
      starter: '# Вычислите выражение и выведите результат\nresult = (15 + 5) * 2 - 10 // 3\nprint(result)\n',
      check: (output) => output.trim() === "37"
    }
  },
  {
    id: 4,
    title: "Строки",
    duration: "15 мин",
    theory: `
      <h2>Создание строк</h2>
      <pre><code>s1 = "Привет"
s2 = 'Мир'
s3 = """Многострочная
строка"""</code></pre>
      <h2>Конкатенация и повторение</h2>
      <pre><code>a = "Hello"
b = "World"
print(a + " " + b)  # Hello World
print("Ha" * 3)     # HaHaHa</code></pre>
      <h2>Индексация и срезы</h2>
      <pre><code>s = "Python"
print(s[0])    # P  первый символ
print(s[-1])   # n  последний символ
print(s[0:3])  # Pyt срез с 0 по 2
print(s[2:])   # thon с 2 до конца
print(s[::-1]) # nohtyP реверс</code></pre>
      <h2>Полезные методы строк</h2>
      <pre><code>s = "  Hello, World!  "
print(s.strip())       # "Hello, World!"
print(s.upper())       # "  HELLO, WORLD!  "
print(s.lower())       # "  hello, world!  "
print(s.replace("World", "Python"))
print(s.split(","))    # ['  Hello', ' World!  ']</code></pre>
      <h2>Форматирование строк (f-strings)</h2>
      <pre><code>name = "Alice"
age = 25
print(f"Меня зовут {name}, мне {age} лет")
print(f"Через 5 лет: {age + 5}")</code></pre>
    `,
    task: {
      description: 'Создайте переменную <code>text</code> со значением <code>"python"</code>. Выведите её в верхнем регистре, затем в нижнем регистре, а затем — реверс строки. Каждая часть на новой строке.',
      starter: 'text = "python"\n# Выведите: PYTHON, python, nohtyp (каждое с новой строки)\n',

// ============ PYODIDE ============
async function loadPyodide() {
  const status = document.getElementById('loadStatus');
  try {
    status.textContent = 'Загрузка Pyodide...';
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js';
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
    status.textContent = 'Инициализация Python...';
    pyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/' });
    status.textContent = 'Готово!';
    setTimeout(() => {
      document.getElementById('pyLoading').style.display = 'none';
    }, 500);
  } catch(e) {
    status.textContent = 'Ошибка загрузки. Обновите страницу.';
    console.error(e);
  }
}

// ============ RUN PYTHON ============
async function runPython(code, outputEl) {
  outputEl.textContent = 'Выполнение...';
  outputEl.className = 'output-section';
  
  try {
    pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
_input_queue = []
def simulate_input(val):
    _input_queue.append(str(val))
def _fake_input(prompt=""):
    if _input_queue:
        return _input_queue.pop(0)
    return ""
import builtins
builtins.input = _fake_input
_virtual_fs = {}
def virtual_write(filename, content):
    _virtual_fs[filename] = content
def virtual_read(filename):
    if filename not in _virtual_fs:
        raise FileNotFoundError(f"File not found: {filename}")
    return _virtual_fs[filename]
`);
    
    // Run user code
    await pyodide.runPythonAsync(code);
    
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    const stderr = pyodide.runPython('sys.stderr.getvalue()');
    
    let output = stdout;
    if (stderr) output += (output ? '\n' : '') + stderr;
    
    outputEl.textContent = output || '(нет вывода)';
    outputEl.className = 'output-section';
    return { success: true, output: stdout.trim() };
  } catch(e) {
    outputEl.textContent = '❌ Ошибка:\n' + e.message;
    outputEl.className = 'output-section error';
    return { success: false, output: '' };
  }
}
